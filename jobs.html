<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Explorer & Filters — CareerAI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="demo-mode-banner"></div>
  <header id="main-navbar"></header>

  <main class="main-content">
    <div class="container">
      
      <!-- Page Title & Header -->
      <div style="margin-bottom: 1.5rem;">
        <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">Job Opportunities Explorer</h1>
        <p style="font-size: 0.92rem; color: var(--slate-600);">
          Explore 50+ curated technology vacancies. 
          <span id="jobs-header-status-note">Log in as a student to see personalized AI match percentages.</span>
        </p>
      </div>

      <!-- Multi-Facet Search & Filter Bar -->
      <div class="filter-bar">
        <!-- Search Keyword Input -->
        <input type="text" id="filter-search" class="form-control" placeholder="Search by role, company, or skill (e.g. PyTorch, React, Cloud)...">

        <!-- Category Dropdown -->
        <select id="filter-category" class="form-control">
          <option value="">All Categories</option>
          <option value="AI / Machine Learning">AI & Machine Learning</option>
          <option value="Data Science">Data Science & Analytics</option>
          <option value="Frontend">Frontend Engineering</option>
          <option value="Backend">Backend Engineering</option>
          <option value="Full Stack">Full Stack Development</option>
          <option value="Cloud & DevOps">Cloud & DevOps</option>
          <option value="Mobile App Dev">Mobile Development</option>
          <option value="Cybersecurity">Cybersecurity</option>
          <option value="Quality Assurance">Quality Assurance / SDET</option>
        </select>

        <!-- Work Mode Dropdown -->
        <select id="filter-mode" class="form-control">
          <option value="">All Work Modes</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-site">On-site</option>
        </select>

        <!-- Sort By Dropdown -->
        <select id="filter-sort" class="form-control">
          <option value="match">Sort by: AI Match Score</option>
          <option value="newest">Sort by: Newest First</option>
          <option value="salary">Sort by: Highest Salary</option>
          <option value="title">Sort by: Job Title</option>
        </select>

        <!-- Reset Button -->
        <button class="btn btn-outline btn-sm" onclick="resetFilters()">
          Clear Filters
        </button>
      </div>

      <!-- Active Filter Status & Count -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.88rem; color: var(--slate-600);">
        <div>
          Showing <strong id="jobs-count-display">0</strong> job opportunities
        </div>
        <div style="font-size: 0.82rem; color: var(--slate-500);">
          🏷️ All 52 listings are synthetic demonstration models for B.Tech AI PBL evaluation.
        </div>
      </div>

      <!-- Jobs Grid Container -->
      <div id="jobs-list-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--slate-500);">
          Loading job listings...
        </div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>

  <!-- Firebase SDK v10.8.0 (Compat libraries for pure vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/recommender.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allJobs = [];
    let currentProfile = null;
    let savedJobIds = [];

    document.addEventListener('DOMContentLoaded', async () => {
      CareerApp.initPage('jobs');

      const user = CareerAuth.getCurrentUser();
      if (user && user.role === 'student') {
        currentProfile = await CareerDB.getUserProfile(user.uid);
        savedJobIds = await CareerDB.getSavedJobIds(user.uid);
        document.getElementById('jobs-header-status-note').innerHTML = `Personalized for <strong>${currentProfile.fullName || user.displayName}</strong> (${currentProfile.degree || 'B.Tech'}).`;
      } else {
        document.getElementById('filter-sort').value = 'newest';
      }

      allJobs = await CareerDB.getJobs();
      applyFiltersAndRender();

      // Add input event listeners
      document.getElementById('filter-search').addEventListener('input', applyFiltersAndRender);
      document.getElementById('filter-category').addEventListener('change', applyFiltersAndRender);
      document.getElementById('filter-mode').addEventListener('change', applyFiltersAndRender);
      document.getElementById('filter-sort').addEventListener('change', applyFiltersAndRender);
    });

    function applyFiltersAndRender() {
      const q = document.getElementById('filter-search').value.toLowerCase().trim();
      const cat = document.getElementById('filter-category').value;
      const mode = document.getElementById('filter-mode').value;
      const sortBy = document.getElementById('filter-sort').value;

      // Filter
      let filtered = allJobs.filter(job => {
        if (cat && job.category !== cat) return false;
        if (mode && job.workMode !== mode) return false;
        if (q) {
          const matchTitle = (job.title || '').toLowerCase().includes(q);
          const matchComp = (job.company || '').toLowerCase().includes(q);
          const matchSkills = (job.requiredSkills || []).some(s => s.toLowerCase().includes(q));
          const matchDesc = (job.description || '').toLowerCase().includes(q);
          if (!matchTitle && !matchComp && !matchSkills && !matchDesc) return false;
        }
        return true;
      });

      // Score and Sort
      let scoredItems = [];
      if (currentProfile) {
        scoredItems = CareerRecommender.rankJobsForProfile(currentProfile, filtered);
      } else {
        scoredItems = filtered.map(j => ({ job: j, match: null }));
      }

      if (sortBy === 'match' && currentProfile) {
        scoredItems.sort((a, b) => (b.match ? b.match.overallScore : 0) - (a.match ? a.match.overallScore : 0));
      } else if (sortBy === 'newest') {
        scoredItems.sort((a, b) => new Date(b.job.postedDate) - new Date(a.job.postedDate));
      } else if (sortBy === 'salary') {
        scoredItems.sort((a, b) => (b.job.minSalaryAnnualINR || 0) - (a.job.minSalaryAnnualINR || 0));
      } else if (sortBy === 'title') {
        scoredItems.sort((a, b) => a.job.title.localeCompare(b.job.title));
      }

      renderJobList(scoredItems);
    }

    function renderJobList(items) {
      const container = document.getElementById('jobs-list-container');
      document.getElementById('jobs-count-display').textContent = items.length;

      if (items.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; background-color: #ffffff; border: 1px dashed var(--slate-300); border-radius: var(--radius-lg);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div>
            <h3 style="color: var(--navy-800); margin-bottom: 0.5rem;">No matching job opportunities found</h3>
            <p style="font-size: 0.9rem; color: var(--slate-500); margin-bottom: 1rem;">Try clearing or adjusting your search keywords or category filters.</p>
            <button class="btn btn-outline btn-sm" onclick="resetFilters()">Reset All Filters</button>
          </div>
        `;
        return;
      }

      let html = '';
      items.forEach(item => {
        const j = item.job;
        const m = item.match;
        const isSaved = savedJobIds.includes(j.id);
        const scoreClass = m ? (m.overallScore >= 80 ? 'match-high' : (m.overallScore >= 60 ? 'match-mid' : 'match-low')) : '';

        const candidateSkillsSet = new Set(currentProfile ? (currentProfile.skills || []).map(s => CareerRecommender.normalizeSkill(s)) : []);

        html += `
          <div class="job-card">
            <div>
              <div class="job-card-top" style="margin-bottom: 0.75rem;">
                <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
                  <div class="job-company-avatar">${j.company.charAt(0)}</div>
                  <div>
                    <a href="job-details.html?id=${j.id}">
                      <h3 style="font-size: 1.1rem; color: var(--navy-900);">${j.title}</h3>
                    </a>
                    <div style="font-size: 0.84rem; font-weight: 600; color: var(--slate-600);">${j.company}</div>
                  </div>
                </div>

                ${m ? `
                  <span class="match-score-badge ${scoreClass}" style="flex-shrink: 0; font-size: 0.82rem;">
                    ${m.overallScore}%
                  </span>
                ` : ''}
              </div>

              <div class="job-meta-row" style="margin-bottom: 0.85rem;">
                <span class="job-meta-item">📍 ${j.location}</span>
                <span class="job-badge-tag">${j.workMode}</span>
                <span class="job-badge-tag">${j.experienceLevel}</span>
              </div>

              <div style="font-size: 0.85rem; color: var(--slate-600); margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5;">
                ${j.description}
              </div>

              <!-- Skills preview -->
              <div class="job-skills-container">
                ${(j.requiredSkills || []).slice(0, 4).map(s => {
                  const norm = CareerRecommender.normalizeSkill(s);
                  const isMatch = candidateSkillsSet.has(norm);
                  return `<span class="skill-pill ${isMatch ? 'skill-pill-matched' : ''}">${isMatch ? '✓ ' : ''}${s}</span>`;
                }).join('')}
                ${(j.requiredSkills || []).length > 4 ? `<span class="skill-pill">+${j.requiredSkills.length - 4} more</span>` : ''}
              </div>
            </div>

            <div class="job-card-footer">
              <span style="font-weight: 700; font-size: 0.88rem; color: var(--navy-900);">
                💰 ${j.salaryRange.split('/')[0]}
              </span>
              <div style="display: flex; gap: 0.4rem;">
                ${currentProfile ? `
                  <button class="btn ${isSaved ? 'btn-secondary' : 'btn-outline'} btn-sm" onclick="toggleSave('${j.id}')" id="save-btn-${j.id}" title="Bookmark Job">
                    ${isSaved ? '★' : '☆'}
                  </button>
                ` : ''}
                <a href="job-details.html?id=${j.id}" class="btn btn-primary btn-sm">
                  Details &rarr;
                </a>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function toggleSave(jobId) {
      const user = CareerAuth.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const res = await CareerDB.toggleSaveJob(user.uid, jobId);
        savedJobIds = await CareerDB.getSavedJobIds(user.uid);
        const btn = document.getElementById(`save-btn-${jobId}`);
        if (btn) {
          btn.className = res.saved ? 'btn btn-secondary btn-sm' : 'btn btn-outline btn-sm';
          btn.textContent = res.saved ? '★' : '☆';
        }
        CareerApp.showToast(res.saved ? 'Job bookmarked in Cloud Firestore!' : 'Job removed from bookmarks.', 'info');
      } catch (err) {
        console.error(err);
        CareerApp.showToast(`Bookmark error: ${err.message}`, 'error');
      }
    }

    function resetFilters() {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-mode').value = '';
      document.getElementById('filter-sort').value = currentProfile ? 'match' : 'newest';
      applyFiltersAndRender();
    }
  </script>
</body>
</html>
