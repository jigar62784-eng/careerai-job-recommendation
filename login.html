<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CareerAI Recommendation System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="demo-mode-banner"></div>
  <header id="main-navbar"></header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 460px;">
      
      <div class="card" style="box-shadow: var(--shadow-lg); border-color: var(--slate-300);">
        <div class="card-header" style="text-align: center; display: block; padding-bottom: 0.75rem;">
          <h2 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Sign In to CareerAI</h2>
          <p style="font-size: 0.85rem; color: var(--slate-500);" id="login-mode-subtitle">
            Authenticating via Google Cloud Firebase
          </p>
        </div>

        <div class="card-body">
          <!-- Active Mode Notice -->
          <div id="login-mode-pill" style="font-size: 0.78rem; text-align: center; margin-bottom: 1.25rem; padding: 0.4rem; border-radius: var(--radius-sm); font-weight: 600;"></div>

          <!-- One-click Demo Actions -->
          <div style="background-color: var(--slate-50); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--slate-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
              ⚡ Quick Offline Demo Mode (No Cloud Sync)
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <button type="button" class="btn btn-outline btn-sm" style="width: 100%; background: #ffffff;" onclick="quickLogin('student')">
                🎓 Continue as Demo Student (Offline)
              </button>
              <button type="button" class="btn btn-outline btn-sm" style="width: 100%; background: #ffffff;" onclick="quickLogin('admin')">
                🛡️ Continue as Demo Admin (Offline)
              </button>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem;">
            <div style="flex: 1; height: 1px; background-color: var(--slate-200);"></div>
            <span style="font-size: 0.78rem; color: var(--slate-400); text-transform: uppercase; font-weight: 600;" id="auth-provider-label">Firebase Account Credentials</span>
            <div style="flex: 1; height: 1px; background-color: var(--slate-200);"></div>
          </div>

          <form id="login-form">
            <!-- Loading Indicator -->
            <div id="login-loading-alert" style="display: none; background-color: var(--blue-50); border: 1px solid var(--blue-200); color: var(--blue-700); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
              ⏳ Contacting Firebase Authentication...
            </div>

            <!-- Error Box -->
            <div id="login-error-alert" style="display: none; background-color: var(--rose-50); border: 1px solid var(--rose-300); color: var(--rose-700); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem;"></div>

            <!-- Success Box -->
            <div id="login-success-alert" style="display: none; background-color: var(--emerald-50); border: 1px solid var(--emerald-300); color: var(--emerald-700); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
              ✓ Authentication successful! Loading your student profile...
            </div>

            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" class="form-control" required placeholder="name@domain.edu">
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
                <span style="font-size: 0.78rem; color: var(--slate-400);">(Min 6 characters)</span>
              </div>
              <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
              Sign In
            </button>
          </form>
        </div>

        <div class="card-footer" style="justify-content: center; font-size: 0.85rem; color: var(--slate-600);">
          Need an account?&nbsp;<a href="register.html" style="font-weight: 600;">Register as Student</a>
        </div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>

  <!-- Firebase SDK v10.8.0 (Compat libraries for pure vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/recommender.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CareerApp.initPage('login');

      // Update mode pill
      const mode = FirebaseConfigManager.getAppMode();
      const modePill = document.getElementById('login-mode-pill');
      if (mode.isDemo) {
        modePill.style.backgroundColor = 'var(--blue-50)';
        modePill.style.color = 'var(--blue-700)';
        modePill.innerHTML = `Mode: <strong>Demo Mode (Local Storage)</strong>`;
        document.getElementById('auth-provider-label').textContent = 'Demo Mode Account';
      } else {
        modePill.style.backgroundColor = 'var(--emerald-50)';
        modePill.style.color = 'var(--emerald-700)';
        modePill.innerHTML = `Target: <strong>Firebase Live (careerai-a4947)</strong>`;
        document.getElementById('auth-provider-label').textContent = 'Firebase Authentication';
      }

      // Check if already logged in
      const currentUser = CareerAuth.getCurrentUser();
      if (currentUser) {
        window.location.href = currentUser.role === 'admin' ? 'admin.html' : 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errBox = document.getElementById('login-error-alert');
      const loadBox = document.getElementById('login-loading-alert');
      const successBox = document.getElementById('login-success-alert');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        successBox.style.display = 'none';
        loadBox.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = await CareerAuth.login(email, password);
        loadBox.style.display = 'none';

        if (res.success) {
          successBox.style.display = 'block';
          CareerApp.showToast(`Welcome, ${res.user.displayName}!`, 'success');
          setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || (res.user.role === 'admin' ? 'admin.html' : 'dashboard.html');
            window.location.href = redirect;
          }, 600);
        } else {
          errBox.textContent = res.error;
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });

    function quickLogin(role) {
      if (role === 'student') {
        CareerAuth.loginAsDemoStudent();
        CareerApp.showToast('Logged in as Demo Student: Aarav Sharma', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
      } else {
        CareerAuth.loginAsDemoAdmin();
        CareerApp.showToast('Logged in as Demo Admin: Dr. Neha Kapoor', 'success');
        setTimeout(() => { window.location.href = 'admin.html'; }, 300);
      }
    }
  </script>
</body>
</html>
